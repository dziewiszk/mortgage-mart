version: 2

models:
  - name: stg_hmda
    description: "One row per HMDA application record for Ohio, 2025, cleaned and typed. The source has no loan ID, so source_row_id is a surrogate key."
    columns:
      - name: source_row_id
        description: "Row position in the raw table. Surrogate key."
        data_tests:
          - not_null
          - unique
      - name: lei
        description: "Legal entity identifier of the reporting lender."
        data_tests:
          - not_null
      - name: action_taken_code
        description: "HMDA outcome code, 1 to 8."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7, 8]